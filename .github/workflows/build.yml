name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the logue SDK and CMSIS
        run: |
          git submodule update --init --depth 1 logue-sdk
          git -C logue-sdk submodule update --init --depth 1 platform/ext/CMSIS
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi zip
      - name: Build unit
        run: make
      - name: Render demos
        run: make render
      - uses: actions/upload-artifact@v4
        with:
          name: waveshaper
          path: |
            oscillators/waveshaper/waveshaper.mnlgxdunit
            renders/*.wav
